[package]
name = "medusa-pos"
version = "0.4.1"
description = "Point of Sale application for MedusaJS"
authors = ["Nari Solutions"]
edition = "2021"

[features]
default = []
devtools = ["tauri/devtools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "medusa_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "wry"], default-features = false }
tauri-plugin-opener = "2.5"
tauri-plugin-store = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared POS peripheral layer (ESC/POS printing, USB enumeration, Windows
# spooler, keyboard detection). Consumed library-style — the plugin's `init()`
# is deliberately not registered, so this app keeps its own command names.
tauri-plugin-pos-hardware = { git = "https://github.com/narisolutions/pos-toolkit", branch = "main" }
tauri-plugin-http = "2.5.9"
tauri-plugin-fs = "2.4"
tauri-plugin-dialog = "2.7"
log = "0.4.31"
tauri-plugin-log = "2.9"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
tokio = { version = "1", features = ["sync"], default-features = false }
