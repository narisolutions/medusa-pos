# CI gate — runs the frontend checks (lint, typecheck, tests, production build) on
# every push to and PR into `develop` and `main`. This is the safety layer for
# releases: work lands on `develop` first, so a broken commit fails there instead
# of on the merge to `main` or midway through the much heavier release/installer
# pipeline.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Private plugins mount into src/plugins/ and must never be committed here
      # (.gitignore allowlists the seam); a forced add would publish them.
      - name: Guard the plugin seam
        run: |
          unexpected="$(git ls-files src/plugins \
            | grep -vE '^src/plugins/(index\.ts|providers\.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Private plugin files must not be committed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
